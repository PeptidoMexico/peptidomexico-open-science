name: R package checks

on:
  push:
    paths:
      - "packages/peptideCalculations/**"
      - ".github/workflows/r-package.yml"
  pull_request:
    paths:
      - "packages/peptideCalculations/**"
      - ".github/workflows/r-package.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/peptideCalculations
          extra-packages: any::rcmdcheck any::testthat
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/peptideCalculations
