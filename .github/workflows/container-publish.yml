name: Publish reproducible container

on:
  workflow_dispatch:
  push:
    tags:
      - "container-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./containers/repro-lab-kit/Dockerfile
          push: true
          tags: ghcr.io/peptidomexico/repro-lab-kit:0.1.0
