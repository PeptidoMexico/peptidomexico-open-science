name: Package quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/peptide-calculations
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/peptide-calculations/package-lock.json
      - run: npm ci
      - run: npm run pack:check

  visualizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syringe-visualizer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/syringe-visualizer/package-lock.json
      - run: npm ci
      - run: npm run pack:check
